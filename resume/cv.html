<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct CV | Tawsif Torabi</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..600;1,14..32,300..600&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="../assets/css/style.css?v=2.5">

  <style>
/* ==========================================================================
   Tawsif Torabi - Portfolio & Academic Profile
   Modern Minimal & Reader-Friendly Design System
   ========================================================================== */

/* --- Design Tokens & Color Palettes --- */
:root {
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-heading: 'Outfit', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Light Theme (Reader-friendly, crisp & minimal) */
  --bg-body: #f8fafc;
  --bg-surface: #ffffff;
  --bg-surface-elevated: #ffffff;
  --bg-surface-subtle: #f1f5f9;
  --bg-surface-hover: #f8fafc;
  
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;
  --border-focus: #3b82f6;

  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #64748b;
  --text-subtle: #94a3b8;

  --accent-primary: #2563eb;
  --accent-primary-hover: #1d4ed8;
  --accent-primary-subtle: #eff6ff;
  --accent-primary-glow: rgba(37, 99, 235, 0.25);

  --accent-secondary: #0d9488;
  --accent-secondary-subtle: #f0fdfa;
  --accent-amber: #d97706;
  --accent-amber-subtle: #fffbeb;
  --accent-rose: #e11d48;
  --accent-rose-subtle: #fff1f2;
  --accent-purple: #7c3aed;
  --accent-purple-subtle: #faf5ff;

  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
  --shadow-hover: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.04);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --nav-height: 68px;
  --transition-fast: 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-base: 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Dark Theme (Deep Obsidian Slate) */
[data-theme="dark"] {
  --bg-body: #0b0f19;
  --bg-surface: #111827;
  --bg-surface-elevated: #1f2937;
  --bg-surface-subtle: #1e293b;
  --bg-surface-hover: #1e293b;

  --border-subtle: #1e293b;
  --border-strong: #334155;
  --border-focus: #60a5fa;

  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;

  --accent-primary: #3b82f6;
  --accent-primary-hover: #60a5fa;
  --accent-primary-subtle: rgba(59, 130, 246, 0.12);
  --accent-primary-glow: rgba(59, 130, 246, 0.35);

  --accent-secondary: #14b8a6;
  --accent-secondary-subtle: rgba(20, 184, 166, 0.12);
  --accent-amber: #f59e0b;
  --accent-amber-subtle: rgba(245, 158, 11, 0.12);
  --accent-rose: #f43f5e;
  --accent-rose-subtle: rgba(244, 63, 94, 0.12);
  --accent-purple: #a855f7;
  --accent-purple-subtle: rgba(168, 85, 247, 0.12);

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.6);
  --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
}

/* --- Base & Reset --- */
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  zoom: 1.25;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-height) + 20px);
}
@media (max-width: 768px) {
  html {
    zoom: 1.15;
  }
}
@media (max-width: 480px) {
  html {
    zoom: 1.05;
  }
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-body);
  color: var(--text-secondary);
  line-height: 1.74;
  font-size: 15.5px;
  font-weight: 380;
  letter-spacing: 0.012em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  transition: background-color var(--transition-base), color var(--transition-base);
}

/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-track {
  background: var(--bg-body);
}
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-full);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

/* Typography Defaults */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--text-primary);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-top: 0;
}

a {
  color: var(--accent-primary);
  text-decoration: none;
  transition: color var(--transition-fast);
}
a:hover {
  color: var(--accent-primary-hover);
  text-decoration: none;
}

/* --- Top Scroll Indicator --- */
#scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 0%;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
  z-index: 10000;
  transition: width 0.1s linear;
}

/* --- Page Preloader & Animated Logo --- */
#loaderCont,
#loaderCont2 {
  background: var(--bg-body);
  width: 100%;
  position: fixed;
  height: 100%;
  top: 0;
  left: 0;
  z-index: 9999999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s ease, visibility 0.5s ease;
  user-select: none;
}

#loaderCont.fadeout,
#loaderCont2.fadeout {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loaderSVG {
  width: 170px;
  max-width: 75vw;
  height: 170px;
  display: block;
  border: none;
  background: transparent;
  pointer-events: none;
  transition: filter var(--transition-fast);
}

/* Adaptive Theme Filter: Pure Black on Light Theme, Pure White on Dark Theme */
[data-theme="light"] .loaderSVG,
:root:not([data-theme="dark"]) .loaderSVG {
  filter: brightness(0);
}

[data-theme="dark"] .loaderSVG {
  filter: brightness(0) invert(1);
}

/* --- Navigation Bar --- */
.site-nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--nav-height);
  background: rgba(248, 250, 252, 0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-subtle);
  z-index: 1000;
  transition: all var(--transition-fast);
}
[data-theme="dark"] .site-nav {
  background: rgba(11, 15, 25, 0.85);
  border-bottom: 1px solid var(--border-subtle);
}
.site-nav.scrolled {
  box-shadow: var(--shadow-sm);
}
.nav-container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 24px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}
.nav-brand-img {
  height: 38px;
  width: auto;
  filter: brightness(0); /* Black on light theme */
  transition: filter var(--transition-fast), transform var(--transition-fast);
}
[data-theme="dark"] .nav-brand-img {
  filter: brightness(0) invert(1); /* Pure white on dark theme */
}
.nav-brand:hover .nav-brand-img {
  transform: scale(1.04);
}
.nav-brand-text {
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}
.nav-brand-badge {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: var(--radius-full);
  background: var(--accent-primary-subtle);
  color: var(--accent-primary);
  border: 1px solid var(--accent-primary-glow);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 6px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav-link-item a {
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-muted);
  padding: 8px 13px;
  border-radius: var(--radius-sm);
  transition: all var(--transition-fast);
}
.nav-link-item a:hover,
.nav-link-item a.active {
  color: var(--accent-primary);
  background: var(--accent-primary-subtle);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.theme-toggle-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 1rem;
}
.theme-toggle-btn:hover {
  color: var(--text-primary);
  border-color: var(--border-strong);
  transform: rotate(15deg);
}

.nav-mobile-toggle {
  display: none;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 1.1rem;
}

@media (max-width: 992px) {
  .nav-mobile-toggle {
    display: block;
  }
  .nav-links {
    position: absolute;
    top: var(--nav-height);
    left: 0;
    width: 100%;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    flex-direction: column;
    padding: 16px 24px;
    gap: 8px;
    box-shadow: var(--shadow-lg);
    display: none;
  }
  .nav-links.open {
    display: flex;
  }
  .nav-link-item {
    width: 100%;
  }
  .nav-link-item a {
    display: block;
    width: 100%;
    padding: 10px 14px;
  }
}

/* --- Container Utility --- */
.container-main {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 24px;
}
.section-wrapper {
  padding: 80px 0;
  position: relative;
}
.section-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-subtle) 20%, var(--border-subtle) 80%, transparent);
  border: none;
  margin: 0;
}

/* --- Section Headers --- */
.section-head-wrap {
  margin-bottom: 44px;
}
.section-pretitle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent-primary);
  background: var(--accent-primary-subtle);
  padding: 4px 12px;
  border-radius: var(--radius-full);
  margin-bottom: 12px;
  border: 1px solid var(--accent-primary-glow);
}
.section-title-main {
  font-size: 2.25rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  margin-bottom: 12px;
  line-height: 1.2;
}
.section-title-main span {
  color: var(--accent-primary);
  position: relative;
}
.section-subtitle-main {
  font-size: 1.05rem;
  color: var(--text-muted);
  max-width: 680px;
  line-height: 1.6;
}

/* ==========================================================================
   Hero / Bio Section
   ========================================================================== */
.hero-section {
  padding-top: calc(var(--nav-height) + 48px);
  padding-bottom: 72px;
}
.hero-grid {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 48px;
  align-items: start;
}
@media (max-width: 900px) {
  .hero-grid {
    grid-template-columns: 1fr;
    gap: 36px;
  }
}

/* Hero Left Profile Card */
.profile-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  position: relative;
  transition: transform var(--transition-base), box-shadow var(--transition-base);
}
.profile-card:hover {
  box-shadow: var(--shadow-md);
}

.avatar-wrapper {
  position: relative;
  display: inline-block;
  margin-bottom: 20px;
}
.profile-avatar {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--bg-surface);
  box-shadow: 0 0 0 3px var(--border-subtle), var(--shadow-md);
  cursor: pointer;
  transition: all 0.35s ease;
  position: relative;
  z-index: 2;
}
.profile-avatar:hover {
  transform: scale(1.03);
  box-shadow: 0 0 0 4px var(--accent-primary), var(--shadow-lg);
}

/* Easter Egg Leer */
.leerHide {
  display: none;
}
.leer {
  position: fixed;
  z-index: 99999;
  width: min(80vw, 480px);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  box-shadow: 0 0 50px rgba(132, 4, 129, 0.8);
  animation: leerPulse 1.2s infinite alternate ease-in-out;
}
.leerbg {
  position: fixed;
  inset: 0;
  background: rgba(132, 4, 129, 0.85);
  backdrop-filter: blur(8px);
  z-index: 99998;
  cursor: pointer;
}
.leerbgHide {
  display: none;
}
@keyframes leerPulse {
  0% { transform: translate(-50%, -50%) scale(0.95); }
  100% { transform: translate(-50%, -50%) scale(1.05); }
}

.profile-name {
  font-family: var(--font-heading);
  font-size: 1.7rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.profile-tagline {
  font-size: 0.88rem;
  color: var(--text-muted);
  font-weight: 500;
  margin-bottom: 16px;
}

.profile-affiliations {
  list-style: none;
  padding: 0;
  margin: 0 0 20px 0;
  text-align: left;
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
  padding: 14px 0;
}
.profile-affiliations li {
  font-size: 0.85rem;
  color: var(--text-secondary);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
  line-height: 1.45;
}
.profile-affiliations li:last-child {
  margin-bottom: 0;
}
.profile-affiliations li i {
  color: var(--accent-primary);
  margin-top: 3px;
  font-size: 0.95rem;
}
.profile-affiliations strong {
  color: var(--text-primary);
}

.social-links-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 24px;
}
.social-icon-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.05rem;
  transition: all var(--transition-fast);
}
.social-icon-btn:hover {
  color: #fff;
  transform: translateY(-3px);
}
.social-icon-btn.fb:hover { background: #1877f2; border-color: #1877f2; }
.social-icon-btn.insta:hover { background: #e4405f; border-color: #e4405f; }
.social-icon-btn.yt:hover { background: #ff0000; border-color: #ff0000; }
.social-icon-btn.gh:hover { background: #24292e; border-color: #24292e; }
.social-icon-btn.in:hover { background: #0a66c2; border-color: #0a66c2; }
.social-icon-btn.scholar:hover { background: #4285f4; border-color: #4285f4; }

/* Quick Profile CTA Buttons */
.profile-cta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.btn-cta-card {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.84rem;
  font-weight: 600;
  text-decoration: none;
  transition: all var(--transition-fast);
  border: 1px solid transparent;
}
.btn-cta-card.primary {
  background: var(--accent-primary);
  color: #fff;
}
.btn-cta-card.primary:hover {
  background: var(--accent-primary-hover);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px var(--accent-primary-glow);
}
.btn-cta-card.outline {
  background: var(--bg-surface);
  border-color: var(--border-strong);
  color: var(--text-secondary);
}
.btn-cta-card.outline:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  background: var(--accent-primary-subtle);
  transform: translateY(-2px);
}

/* Hero Right Content */
.hero-content {
  display: flex;
  flex-direction: column;
}
.hero-badges-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.hero-subtag {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-subtle);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
}

.hero-heading {
  font-size: 2.6rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  line-height: 1.18;
  margin-bottom: 20px;
}
.hero-bio-lead {
  font-size: 1.08rem;
  line-height: 1.75;
  color: var(--text-secondary);
  margin-bottom: 24px;
}
.hero-bio-lead p {
  margin-bottom: 14px;
}
.hero-bio-lead p:last-child {
  margin-bottom: 0;
}

.hero-actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 10px;
}
.btn-primary-action {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 12px 22px;
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-weight: 600;
  background: var(--accent-primary);
  color: #fff;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 14px var(--accent-primary-glow);
  transition: all var(--transition-fast);
}
.btn-primary-action:hover {
  background: var(--accent-primary-hover);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--accent-primary-glow);
}
.btn-secondary-action {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 12px 22px;
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-weight: 600;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.btn-secondary-action:hover {
  background: var(--bg-surface-subtle);
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  transform: translateY(-2px);
}
.btn-yt-action {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 12px 22px;
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-weight: 600;
  background: #ff0000;
  color: #fff;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(255, 0, 0, 0.25);
  transition: all var(--transition-fast);
}
.btn-yt-action:hover {
  background: #cc0000;
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 0, 0, 0.35);
}

/* ==========================================================================
   Publications Section (Academic & Research Focus)
   ========================================================================== */
.publications-section {
  background: var(--bg-surface-subtle);
}
.scholar-stat-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 20px 24px;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 16px;
  box-shadow: var(--shadow-sm);
}
.scholar-info {
  display: flex;
  align-items: center;
  gap: 14px;
}
.scholar-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--accent-primary-subtle);
  color: var(--accent-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;

  function dismissResumeLoader() {
    var loader = document.getElementById("loaderCont");

      setTimeout(function() {

  <script>
    const CV1 = "https://docs.google.com/document/d/1d_VJ1107z7QlcHthnzo1nLBslmB7oQ8BqanONKAITNg/";
    const CV2 = "https://docs.google.com/document/d/1bBtNO1V6_tGfmhnQscU4Mz8jHXbDIJjZD6Nn5wJbNFk/";

    const iframe = document.getElementById("iframe1");
    const dlLink = document.getElementById("dlLink");
    const tabDev = document.getElementById("tabDeveloper");
    const tabMedia = document.getElementById("tabMedia");

    function switchCV(type) {
      if (type === 'media') {
        iframe.src = CV1 + "pub?embedded=true";
        dlLink.href = CV1 + "export?format=pdf";
        tabMedia.classList.add("active");
        tabDev.classList.remove("active");
      } else {
        iframe.src = CV2 + "pub?embedded=true";
        dlLink.href = CV2 + "export?format=pdf";
        tabDev.classList.add("active");
        tabMedia.classList.remove("active");
      }
    }

    const params = new URLSearchParams(window.location.search);
    const requestedType = params.get("type");
    if (requestedType === "multimedia" || requestedType === "media") {
      switchCV('media');
    } else {
      switchCV('developer');
    }

    // Inherit Theme from localStorage
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
